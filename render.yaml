# Render Blueprint Specification for HASHLENS
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hashlens-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
      - key: MAX_UPLOAD_SIZE
        value: "104857600"
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: ENABLE_HSTS
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////app/data/hashlens.db
    healthCheckPath: /api/v1/health

  - type: web
    name: hashlens-dashboard
    env: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: hashlens-backend
          property: url
    healthCheckPath: /_stcore/health
